spring.application.name=ecommerceusb
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_usb_db
spring.datasource.username=ecommerce_usb_usr
spring.datasource.password=ecommerce_usb_pwd
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración para usar snake_case en JSON responses
spring.jackson.property-naming-strategy=SNAKE_CASE

# Deshabilitar data.sql por ahora para probar el schema
# spring.sql.init.mode=always
